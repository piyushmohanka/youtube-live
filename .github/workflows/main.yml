name: Audio Test with CURL

on:
  workflow_dispatch:

jobs:
  stream-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Download Video with CURL (More Reliable)
        run: |
          curl -L -o video.mp4 "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"

      - name: Start Streaming TEST VIDEO
        run: |
          ffmpeg -re -stream_loop -1 -i video.mp4 \
          -vf "crop=ih*9/16:ih,scale=720:1280,format=yuv420p" \
          -c:v libx264 -preset ultrafast -r 30 -g 60 -b:v 3000k \
          -af "aresample=async=1" -c:a aac -ar 44100 -b:a 128k \
          -f flv "rtmps://a.rtmp.youtube.com:443/live2/${{ secrets.STREAM_KEY }}"
