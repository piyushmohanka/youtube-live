name: 24/7 Shorts Feed Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante mein auto-restart hoga 24/7 ke liye

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - name: Download Video
        run: |
          # Google Drive link ko download karne ka zyada behtar tarika
          yt-dlp --no-check-certificate "https://drive.google.com/uc?export=download&id=1OFKIBggSKZUyJsuniPz0H6Tl-kgkoSEm" -o video.mp4

      - name: Start Streaming
        run: |
          # 6 hours ka timeout taaki workflow block na ho
          timeout 6h ffmpeg -fflags +genpts -stream_loop -1 -re -i video.mp4 \
          -vf "crop=ih*9/16:ih,scale=720:1280" \
          -af "aresample=async=1" \
          -c:v libx264 -preset ultrafast -b:v 3000k -maxrate 3000k -bufsize 6000k \
          -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmps://a.rtmp.youtube.com:443/live2/${{ secrets.STREAM_KEY }}"
