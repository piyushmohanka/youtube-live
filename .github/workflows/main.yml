name: Simple Stream (No Loop, Just Works)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - name: Download Your Video
        run: |
          yt-dlp -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/mp4" "https://drive.google.com/uc?export=download&id=1OFKIBggSKZUyJsuniPz0H6Tl-kgkoSEm" -o video.mp4

      - name: Start Streaming (One Time Only)
        run: |
          ffmpeg -re -i video.mp4 \
          -vf "crop=ih*9/16:ih,scale=720:1280,format=yuv420p" \
          -c:v libx264 -preset ultrafast -b:v 2500k \
          -c:a aac -ar 44100 -b:a 128k \
          -f flv "rtmps://a.rtmp.youtube.com:443/live2/${{ secrets.STREAM_KEY }}"
