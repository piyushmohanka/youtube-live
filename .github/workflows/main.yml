name: 24/7 Final Fixed Loop

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - name: Download Video
        run: |
          yt-dlp "https://drive.google.com/uc?export=download&id=1OFKIBggSKZUyJsuniPz0H6Tl-kgkoSEm" -o video.mp4

      - name: Start Streaming
        run: |
          ffmpeg -re -stream_loop -1 -i video.mp4 \
          -vf "scale=854:480" -c:v libx264 -preset ultrafast -tune zerolatency \
          -b:v 1000k -maxrate 1000k -bufsize 2000k -g 60 -keyint_min 60 \
          -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmps://a.rtmp.youtube.com:443/live2/${{ secrets.STREAM_KEY }}"
