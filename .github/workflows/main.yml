name: 24/7 Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante mein apne aap restart hoga

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - name: Download Video
        run: |
          # Is line mein apni sahi video ID daalna
          yt-dlp -f "bestvideo+bestaudio/best" "https://drive.google.com/uc?id=YOUR_FILE_ID" -o video.mp4

      - name: Start Streaming
        run: |
          ffmpeg -re -stream_loop -1 -i video.mp4 -vf "scale=ih*9/16:ih,scale=1080:1920,setsar=1" \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 \
          -f flv -flvflags no_duration_filesize \
          "rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}"
